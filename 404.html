<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rumbo</title>
<script>
  // GitHub Pages serves this for unknown paths. Send people back into the app,
  // which routes entirely on the hash and therefore never 404s again.
  location.replace(location.pathname.replace(/\/404\.html$/, "/") + "#/");
</script>
</head>
<body><p>Redirecting to <a href="./#/">Rumbo</a>&hellip;</p></body>
</html>
